name: Vercel preview

# Vercel's Git integration refuses commits not authored by the team owner (Hobby plan), so branches
# are built and deployed with the CLI instead. Skips cleanly when VERCEL_TOKEN is not set.
on:
  push:
    branches:
      - "claude/**"
      - "devin/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set; skipping preview." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
      - name: Install Vercel CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install --global vercel@66.6.0
      # Deploy source and let Vercel build it remotely: Sensitive variables are only available to builds on
      # Vercel's own machines, so no local build and no `vercel pull` of the environment. Run from the
      # repository root (the project's Root Directory setting, web, is applied by Vercel); .vercelignore
      # keeps the upload to web/ plus assets/*/manifest.json.
      - name: Deploy preview (built on Vercel)
        id: deploy
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The CLI streams the remote build log to stderr; keep it so the next step can read the index line.
          url=$(vercel deploy --token="$VERCEL_TOKEN" 2> >(tee deploy.log >&2))
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for \`$BRANCH\`: $url" >> "$GITHUB_STEP_SUMMARY"
      # Surface whether the remote build made the live index, without opening Vercel.
      - name: Report index build
        if: steps.gate.outputs.run == 'true' && steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel inspect "$PREVIEW_URL" --logs --wait --token="$VERCEL_TOKEN" > build.log 2>&1 || true
          line=$(cat deploy.log build.log 2>/dev/null | grep -i -E "index (build|built)" | grep -v -i "no index-build" | head -3 || true)
          if [ -z "$line" ]; then line="No index-build line found in the Vercel build log."; fi
          printf 'Index build: %s\n' "$line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${process.env.BRANCH}` });
            const marker = "<!-- blackbook-preview -->";
            const body = `${marker}\nPreview deploy: ${process.env.PREVIEW_URL}\n\nCommit ${context.sha.slice(0, 7)}. Sign in as \`jonathan\` with the owner password.`;
            for (const pr of prs.data) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
              const mine = comments.find((comment) => comment.body?.startsWith(marker));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
